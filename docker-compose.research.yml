services:
  duckdb:
    image: docker.io/duckdb/duckdb:1.4.4@sha256:2a5c5fb1bf8a7a93a43893b583cf15fcfebc0b8e02a39110593582907f96d8ad
    entrypoint: ["/duckdb"]
    command: ["/workspace/.research-run/research.duckdb"]
    working_dir: /workspace
    volumes:
      - ./data/research-lake:/workspace/data/research-lake:rw
      - ./.research-run:/workspace/.research-run:rw
    user: "${RESEARCH_UID:-1000}:${RESEARCH_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: none
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
