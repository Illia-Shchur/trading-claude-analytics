name: strategy-v5-prospective-preflight

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      reservation:
        description: repository-relative frozen v5 reservation path
        required: false
        type: string
      source_bundle:
        description: repository-relative frozen v5 prospective source bundle path
        required: false
        type: string

permissions: {}

env:
  V5_EVIDENCE_BRANCH: strategy-v5-evidence
  V5_ATTESTATION_KEY_REGISTRY_PATH: strategy-research/config/v5-attestation-key-registry.json

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: prospective-v5
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Install pinned dependencies
        if: always()
        run: npm ci
      - name: Capture GitHub settings and OIDC evidence
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.V5_GITHUB_SETTINGS_PAT }}
          V5_REQUIRE_SETTINGS_TOKEN: 'true'
          V5_SETTINGS_TOKEN_KIND: PAT
          V5_SETTINGS_TOKEN_USER_ID: ${{ vars.V5_SETTINGS_TOKEN_USER_ID }}
          V5_SETTINGS_TOKEN_LOGIN: ${{ vars.V5_SETTINGS_TOKEN_LOGIN }}
          V5_SETTINGS_TOKEN_SECRET_NAME: ${{ vars.V5_SETTINGS_TOKEN_SECRET_NAME }}
          V5_REPOSITORY_OWNER_ID: ${{ vars.V5_REPOSITORY_OWNER_ID }}
          V5_REPOSITORY_VISIBILITY: ${{ vars.V5_REPOSITORY_VISIBILITY }}
          V5_ACTIONS_ATTESTATION_SECRET_NAME: ${{ vars.V5_ACTIONS_ATTESTATION_SECRET_NAME }}
        run: |
          node tools/capture-github-settings.mjs
      - name: Verify repository-side custody and approval contract
        env:
          V5_PUBLIC_KEYS_PATH: ${{ vars.V5_PUBLIC_KEYS_PATH }}
          V5_APPROVALS_PATH: ${{ vars.V5_APPROVALS_PATH }}
          V5_TRUST_ROOT_PATH: ${{ vars.V5_TRUST_ROOT_PATH }}
          V5_TRUST_ROOT_FINGERPRINT: ${{ vars.V5_TRUST_ROOT_FINGERPRINT }}
          V5_TRUST_ROOT_GENESIS_FINGERPRINT: ${{ vars.V5_TRUST_ROOT_GENESIS_FINGERPRINT }}
        if: always()
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs'
          import { resolve } from 'node:path'
          import { makeDeploymentAuditV5, makeDeploymentSettingsCaptureV5 } from './tools/strategy-research-v5.mjs'
          import { readConfinedJson, repositoryRelativePath } from './tools/strategy-v5-workflow-security.mjs'
          const root = process.env.GITHUB_WORKSPACE || process.cwd()
          const load = (path, label) => {
            if (!path) return {}
            const relativePath = repositoryRelativePath(path, label)
            return existsSync(resolve(root, relativePath)) ? readConfinedJson(root, relativePath, label).value : {}
          }
          const capture = existsSync('github-deployment-settings-capture.json') ? JSON.parse(readFileSync('github-deployment-settings-capture.json', 'utf8')) : makeDeploymentSettingsCaptureV5({ githubApiResponse: { status: 0, body: {} }, oidcSubject: null })
          const audit = makeDeploymentAuditV5({ settings: {}, settingsCapture: capture, keys: load(process.env.V5_PUBLIC_KEYS_PATH, 'v5 public-key registry'), approvals: load(process.env.V5_APPROVALS_PATH, 'v5 approvals'), trustRoot: load(process.env.V5_TRUST_ROOT_PATH, 'v5 trust root') })
          writeFileSync('v5-deployment-audit-early.json', JSON.stringify(audit, null, 2) + '\\n')
          if (audit.blocked) process.exitCode = 1
          NODE
      - name: Emit blocked diagnostic when custody audit is unavailable
        if: always()
        run: |
          if [ ! -f v5-deployment-audit-early.json ]; then
            node --input-type=module -e "import {writeFileSync} from 'node:fs'; import {makeDeploymentAuditV5} from './tools/strategy-research-v5.mjs'; writeFileSync('v5-deployment-audit-early.json', JSON.stringify(makeDeploymentAuditV5({settings:{}}), null, 2)+'\\n')"
          fi
      - name: Hydrate the latest append-only prospective ledger
        if: always()
        env:
          V5_SOURCE_BUNDLE_INPUT: ${{ inputs.source_bundle }}
          V5_PROSPECTIVE_SOURCE_BUNDLE: ${{ vars.V5_PROSPECTIVE_SOURCE_BUNDLE }}
        run: |
          rm -rf .v5-evidence-state .v5-ledger
          mkdir -p .v5-evidence-state
          if git fetch --no-tags --depth=1 origin strategy-v5-evidence; then
            git archive --format=tar origin/strategy-v5-evidence > .v5-evidence-state.tar
            node --input-type=module <<'NODE'
          import { verifyTarArchive } from './tools/strategy-v5-workflow-security.mjs'
          verifyTarArchive('.v5-evidence-state.tar', 'strategy-v5 evidence archive')
          NODE
            tar -x --no-same-owner --no-same-permissions -f .v5-evidence-state.tar -C .v5-evidence-state
            node --input-type=module <<'NODE'
          import { copyFileSync, existsSync, readFileSync, readdirSync } from 'node:fs'
          import { basename, join, resolve } from 'node:path'
          import { readProspectiveLedger } from './tools/strategy-prospective-v5.mjs'
          import { ownHash } from './tools/strategy-readiness-v5.mjs'
          import { validateContractSchema } from './tools/research-schema-registry.mjs'
          import { copyConfinedDirectory, selectProspectiveLedgerCandidateV5, verifySafeTree } from './tools/strategy-v5-workflow-security.mjs'
          verifySafeTree('.v5-evidence-state', 'strategy-v5 evidence checkout')
          const settingsCandidates = []
          const settingsWalk = directory => {
            if (!existsSync(directory)) return
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name)
              if (entry.isDirectory()) settingsWalk(path)
              else if (entry.name === 'github-deployment-settings-capture.json') {
                const apiPath = join(directory, 'github-settings-api-receipt.json')
                if (!existsSync(apiPath)) throw new Error(`GitHub settings baseline is missing its API receipt: ${path}`)
                try {
                  const capture = JSON.parse(readFileSync(path, 'utf8')); const api = JSON.parse(readFileSync(apiPath, 'utf8'))
                  if (capture.schema !== 'github-deployment-settings-capture/1' || capture.content_sha256 !== ownHash(capture) || api.schema !== 'github-settings-api-receipt/1' || api.content_sha256 !== ownHash(api)) throw new Error('settings/API baseline hash or schema is invalid')
                  validateContractSchema(capture); validateContractSchema(api)
                  settingsCandidates.push({ path, apiPath, capturedAt: Date.parse(capture.captured_at), captureSha: capture.content_sha256, apiSha: api.content_sha256 })
                } catch (error) { throw new Error(`invalid historical GitHub settings baseline ${path}: ${error.message}`) }
              }
            }
          }
          await settingsWalk(resolve('.v5-evidence-state'))
          settingsCandidates.sort((a, b) => b.capturedAt - a.capturedAt || String(a.captureSha).localeCompare(String(b.captureSha)))
          if (settingsCandidates.length && Number.isFinite(settingsCandidates[0].capturedAt)) {
            const selected = settingsCandidates[0]
            if (settingsCandidates.filter(row => row.capturedAt === selected.capturedAt && row.captureSha !== selected.captureSha).length) throw new Error('competing GitHub settings baselines share a capture timestamp')
            copyFileSync(selected.path, resolve('.v5-previous-settings-capture.json'))
            copyFileSync(selected.apiPath, resolve('.v5-previous-settings-api-receipt.json'))
          }
          const roots = []
          const walk = directory => {
            if (!existsSync(directory)) return
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name)
              if (entry.isDirectory()) walk(path)
              else if (entry.name === 'HEAD.json' && basename(directory) === 'ledger') roots.push(directory)
            }
          }
          walk(resolve('.v5-evidence-state'))
          const candidates = []
          for (const path of roots) {
            try {
              const ledger = readProspectiveLedger(path, { nowAt: Date.now(), allowFuture: true })
              candidates.push({ path, sequence: ledger.sequence, head: ledger.current_head_sha256, lineage: ledger.lineage_sha256, eventHeads: ledger.events.map(event => event.event_sha256) })
            } catch (error) { throw new Error(`invalid historical ledger ${path}: ${error.message}`) }
          }
          const selected = selectProspectiveLedgerCandidateV5(candidates)
          if (selected) copyConfinedDirectory(selected.path, resolve('.v5-ledger'), 'prospective ledger')
          process.stdout.write(JSON.stringify({ candidates: candidates.length, selected }) + '\n')
          NODE
            rm -f .v5-evidence-state.tar
          else
            echo 'Unable to fetch the protected strategy-v5-evidence branch; refusing to reset custody to genesis.' >&2
            exit 1
          fi
          bundle="${V5_SOURCE_BUNDLE_INPUT:-}"
          if [ -z "$bundle" ]; then bundle="${V5_PROSPECTIVE_SOURCE_BUNDLE:-}"; fi
          if [ -n "$bundle" ]; then
            V5_BUNDLE_PATH="$bundle" node --input-type=module <<'NODE'
          import { existsSync } from 'node:fs'
          import { resolve } from 'node:path'
          import { copyConfinedDirectory, verifyProspectiveSourceBundle } from './tools/strategy-v5-workflow-security.mjs'
          const root = process.env.GITHUB_WORKSPACE || process.cwd()
          const verified = verifyProspectiveSourceBundle({ root, bundlePath: process.env.V5_BUNDLE_PATH })
          if (!existsSync(resolve('.v5-ledger/HEAD.json'))) copyConfinedDirectory(verified.ledger.absolute, resolve('.v5-ledger'), 'prospective source-bundle ledger')
          NODE
          fi
      - name: Compare durable GitHub settings baseline
        if: always()
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs'
          import { makeGitHubSettingsDriftEvidenceV5 } from './tools/strategy-research-v5.mjs'
          if (!existsSync('github-deployment-settings-capture.json') || !existsSync('github-settings-api-receipt.json')) throw new Error('current GitHub settings/API evidence is unavailable; drift comparison is blocked')
          const currentCapture = JSON.parse(readFileSync('github-deployment-settings-capture.json', 'utf8'))
          const currentApiReceipt = JSON.parse(readFileSync('github-settings-api-receipt.json', 'utf8'))
          const previousCapture = existsSync('.v5-previous-settings-capture.json') ? JSON.parse(readFileSync('.v5-previous-settings-capture.json', 'utf8')) : null
          const previousApiReceipt = existsSync('.v5-previous-settings-api-receipt.json') ? JSON.parse(readFileSync('.v5-previous-settings-api-receipt.json', 'utf8')) : null
          const evidence = makeGitHubSettingsDriftEvidenceV5({ currentCapture, currentApiReceipt, previousCapture, previousApiReceipt })
          writeFileSync('github-settings-drift-evidence.json', JSON.stringify(evidence, null, 2) + '\n', { flag: 'wx' })
          if (evidence.status === 'DRIFTED') { console.error('GitHub settings drift detected; activation is demoted and append is blocked'); process.exitCode = 1 }
          NODE
      - name: Run completed 4h-bar SHADOW cycle
        if: always()
        env:
          V5_SOURCE_BUNDLE_INPUT: ${{ inputs.source_bundle }}
          V5_RESERVATION_INPUT: ${{ inputs.reservation }}
          V5_PROSPECTIVE_SOURCE_BUNDLE: ${{ vars.V5_PROSPECTIVE_SOURCE_BUNDLE }}
        run: |
          bundle="${V5_SOURCE_BUNDLE_INPUT:-}"
          if [ -z "$bundle" ]; then bundle="${V5_PROSPECTIVE_SOURCE_BUNDLE:-}"; fi
          if [ -n "$bundle" ]; then
            V5_BUNDLE_PATH="$bundle" node --input-type=module <<'NODE'
          import { verifyProspectiveSourceBundle } from './tools/strategy-v5-workflow-security.mjs'
          const root = process.env.GITHUB_WORKSPACE || process.cwd()
          verifyProspectiveSourceBundle({ root, bundlePath: process.env.V5_BUNDLE_PATH })
          NODE
          fi
          if [ -n "${V5_RESERVATION_INPUT:-}" ]; then
            V5_RESERVATION_PATH="$V5_RESERVATION_INPUT" node --input-type=module <<'NODE'
          import { readConfinedJson } from './tools/strategy-v5-workflow-security.mjs'
          const root = process.env.GITHUB_WORKSPACE || process.cwd()
          readConfinedJson(root, process.env.V5_RESERVATION_PATH, 'prospective reservation')
          NODE
          fi
          if [ -n "$bundle" ]; then
            ledger_args=()
            if [ -s .v5-ledger/HEAD.json ]; then ledger_args=(--ledger .v5-ledger); fi
            if [ -n "${V5_RESERVATION_INPUT:-}" ]; then
              node tools/strategy-research-v5.mjs prospective-runner --source-bundle "$bundle" "${ledger_args[@]}" --reservation "$V5_RESERVATION_INPUT" --receipt v5-shadow-cycle-receipt.json > v5-shadow-cycle.json
            else
              node tools/strategy-research-v5.mjs prospective-runner --source-bundle "$bundle" "${ledger_args[@]}" --receipt v5-shadow-cycle-receipt.json > v5-shadow-cycle.json
            fi
          else
            node tools/strategy-research-v5.mjs prospective-runner --live-source-unconfigured --receipt v5-shadow-cycle-receipt.json > v5-shadow-cycle.json
          fi
      - name: Require a schema-valid completed SHADOW cycle
        if: always()
        run: |
          node --input-type=module -e "import {existsSync,readFileSync} from 'node:fs'; if(!existsSync('v5-shadow-cycle-receipt.json')){console.error('Missing SHADOW cycle receipt');process.exit(1)}; const receipt=JSON.parse(readFileSync('v5-shadow-cycle-receipt.json','utf8')); if(receipt.schema!=='strategy-v5-authoritative-command-receipt/1'){console.error('Cycle receipt schema is invalid');process.exit(1)}; if(receipt.status==='COMPLETE'&&receipt.details?.active===false)process.exit(0); if(receipt.status==='BLOCKED'&&receipt.limitations?.includes('PROSPECTIVE_LIVE_SOURCE_UNCONFIGURED')){console.error('PROSPECTIVE_LIVE_SOURCE_UNCONFIGURED: no verified frozen Binance adapter is configured');process.exit(1)}; console.error('Completed-bar SHADOW cycle is blocked: '+(receipt.limitations||[]).join('; '));process.exit(1)"
      - name: Require cryptographic Actions attestation
        if: always()
        env:
          ACTIONS_ATTESTATION_PRIVATE_KEY_B64: ${{ secrets.PROD_V5_ACTIONS_ATTESTATION_PRIVATE_KEY_B64 }}
          V5_ATTESTATION_KEY_REGISTRY_PATH: ${{ env.V5_ATTESTATION_KEY_REGISTRY_PATH }}
          V5_SETTINGS_CAPTURE_PATH: github-deployment-settings-capture.json
          V5_SETTINGS_RECEIPT_PATH: github-settings-api-receipt.json
          V5_CYCLE_RECEIPT_PATH: v5-shadow-cycle-receipt.json
          V5_ATTESTATION_OUT: v5-actions-attestation.json
          V5_ATTESTATION_KEY_FINGERPRINT: ${{ vars.V5_ATTESTATION_KEY_FINGERPRINT }}
        run: |
          if node --input-type=module -e "import {readFileSync} from 'node:fs'; const r=JSON.parse(readFileSync('v5-shadow-cycle-receipt.json','utf8')); process.exit(r.status==='COMPLETE'?0:1)"; then
            if [ -z "${ACTIONS_ATTESTATION_PRIVATE_KEY_B64:-}" ] || [ ! -s "$V5_ATTESTATION_KEY_REGISTRY_PATH" ]; then
              node --input-type=module -e "import {writeFileSync} from 'node:fs'; import {makeCommandReceipt} from './tools/strategy-research-v5-authoritative.mjs'; const receipt=makeCommandReceipt({command:'github-attestation',status:'BLOCKED',inputs:[],outputs:[],limitations:['ACTIONS_ATTESTATION_KEY_OR_REGISTRY_UNCONFIGURED'],details:{mode:'BLOCKED_MISSING_PROTECTED_KEY_OR_FROZEN_REGISTRY',active:false}}); writeFileSync('v5-actions-attestation-receipt.json',JSON.stringify(receipt,null,2)+'\\n')"
              echo 'ACTIONS_ATTESTATION_KEY_OR_REGISTRY_UNCONFIGURED: protected key or committed registry is unavailable'
              exit 1
            fi
            node tools/sign-github-attestation.mjs
            cp "$V5_ATTESTATION_KEY_REGISTRY_PATH" v5-attestation-key-registry.json
          else
            echo 'SHADOW cycle is blocked; no attestation can unlock publication.'
          fi
      - name: Recompute final deployment audit from post-cycle evidence
        if: always()
        env:
          V5_PUBLIC_KEYS_PATH: ${{ vars.V5_PUBLIC_KEYS_PATH }}
          V5_APPROVALS_PATH: ${{ vars.V5_APPROVALS_PATH }}
          V5_TRUST_ROOT_PATH: ${{ vars.V5_TRUST_ROOT_PATH }}
          V5_TRUST_ROOT_FINGERPRINT: ${{ vars.V5_TRUST_ROOT_FINGERPRINT }}
          V5_TRUST_ROOT_GENESIS_FINGERPRINT: ${{ vars.V5_TRUST_ROOT_GENESIS_FINGERPRINT }}
          V5_ATTESTATION_KEY_FINGERPRINT: ${{ vars.V5_ATTESTATION_KEY_FINGERPRINT }}
          V5_ACTIONS_SECRET_EVIDENCE_PATH: ${{ vars.V5_ACTIONS_SECRET_EVIDENCE_PATH }}
          V5_REPLAY_EVIDENCE_PATH: ${{ vars.V5_REPLAY_EVIDENCE_PATH }}
          V5_REVOCATION_EVIDENCE_PATH: ${{ vars.V5_REVOCATION_EVIDENCE_PATH }}
          V5_LEASE_EVIDENCE_PATH: ${{ vars.V5_LEASE_EVIDENCE_PATH }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs'
          import { resolve } from 'node:path'
          import { makeDeploymentAuditV5 } from './tools/strategy-research-v5.mjs'
          import { confinedPath, readConfinedJson, repositoryRelativePath } from './tools/strategy-v5-workflow-security.mjs'
          const root = process.env.GITHUB_WORKSPACE || process.cwd()
          const load = (path, label) => {
            if (!path) return {}
            const relativePath = repositoryRelativePath(path, label)
            return existsSync(resolve(root, relativePath)) ? readConfinedJson(root, relativePath, label).value : {}
          }
          const ref = (path, label) => {
            if (!path) return undefined
            const relativePath = repositoryRelativePath(path, label)
            if (existsSync(resolve(root, relativePath))) confinedPath(root, relativePath, label)
            return { path: relativePath }
          }
          const settings = {
            settings_capture: ref('github-deployment-settings-capture.json'),
            github_api_receipt: ref('github-settings-api-receipt.json'),
            cycle_receipt: ref('v5-shadow-cycle-receipt.json'),
            github_attestation: ref('v5-actions-attestation.json'),
            attestation_key_registry: ref('v5-attestation-key-registry.json'),
            github_settings_drift: ref('github-settings-drift-evidence.json'),
            actions_only_secret_artifact: ref(process.env.V5_ACTIONS_SECRET_EVIDENCE_PATH, 'actions secret evidence'),
            replay_artifact: ref(process.env.V5_REPLAY_EVIDENCE_PATH, 'replay evidence'),
            revocation_artifact: ref(process.env.V5_REVOCATION_EVIDENCE_PATH, 'revocation evidence'),
            lease_artifact: ref(process.env.V5_LEASE_EVIDENCE_PATH, 'lease evidence'),
          }
          const audit = makeDeploymentAuditV5({
            settings,
            keys: load(process.env.V5_PUBLIC_KEYS_PATH, 'v5 public-key registry'),
            approvals: load(process.env.V5_APPROVALS_PATH, 'v5 approvals'),
            trustRoot: load(process.env.V5_TRUST_ROOT_PATH, 'v5 trust root'),
            pinnedTrustRootFingerprint: process.env.V5_TRUST_ROOT_FINGERPRINT || null,
            pinnedTrustRootGenesisFingerprint: process.env.V5_TRUST_ROOT_GENESIS_FINGERPRINT || null,
          })
          writeFileSync('v5-deployment-audit.json', JSON.stringify(audit, null, 2) + '\n')
          if (audit.blocked) process.exitCode = 1
          NODE
      - name: Upload blocked deployment audit and SHADOW cycle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategy-v5-deployment-audit
          include-hidden-files: true
          path: |
            v5-deployment-audit.json
            v5-deployment-audit-early.json
            v5-shadow-cycle.json
            v5-shadow-cycle-receipt.json
            v5-actions-attestation.json
            v5-actions-attestation-receipt.json
            .v5-ledger
            github-deployment-settings-capture.json
            github-settings-api-receipt.json
            github-settings-drift-evidence.json
            v5-attestation-key-registry.json
          if-no-files-found: warn
      - name: Keep activation fail-closed
        if: always()
        run: |
          node --input-type=module -e "import {existsSync,readFileSync} from 'node:fs'; if (!existsSync('v5-deployment-audit.json')) { console.error('Missing deployment audit; blocked.'); process.exit(1) }; const audit=JSON.parse(readFileSync('v5-deployment-audit.json','utf8')); if (audit.blocked !== false) { console.error('Deployment custody is not proven; remain blocked.'); process.exit(1) }"
      # The workflow deliberately stops until the deployment audit is backed
      # by real protected settings, OIDC identity, approval keys and offline
      # activation-root verification. It never prints or commits secrets.

  append-protected-evidence:
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    concurrency:
      group: strategy-v5-evidence-append
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: strategy-v5-evidence
          path: evidence-worktree
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          path: verifier-worktree
      - name: Install pinned verifier dependencies
        working-directory: verifier-worktree
        run: npm ci
      - name: Download verified preflight artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: strategy-v5-deployment-audit
          path: evidence-worktree/.v5-preflight
      - name: Append immutable SHADOW evidence by normal CAS push
        env:
          EVIDENCE_BRANCH: strategy-v5-evidence
          TRUSTED_SOURCE_SHA: ${{ github.sha }}
          V5_ATTESTATION_KEY_FINGERPRINT: ${{ vars.V5_ATTESTATION_KEY_FINGERPRINT }}
        working-directory: evidence-worktree
        run: |
          test "$(git -C ../verifier-worktree rev-parse HEAD)" = "$TRUSTED_SOURCE_SHA"
          test -s .v5-preflight/v5-deployment-audit.json
          test -s .v5-preflight/v5-shadow-cycle-receipt.json
          test -s .v5-preflight/v5-shadow-cycle.json
          test -s .v5-preflight/github-settings-api-receipt.json
          test -s .v5-preflight/github-settings-drift-evidence.json
          test -s .v5-preflight/v5-actions-attestation.json
          test -s .v5-preflight/v5-attestation-key-registry.json
          test -s .v5-preflight/v5-deployment-audit.json
          test -s .v5-preflight/github-deployment-settings-capture.json
          test -s .v5-preflight/.v5-ledger/HEAD.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { hash, verifyActionsAttestation } from '../verifier-worktree/tools/strategy-readiness-v5.mjs'
          import { verifyGitHubSettingsDriftEvidenceV5 } from '../verifier-worktree/tools/strategy-research-v5.mjs'
          import { validateContractSchema } from '../verifier-worktree/tools/research-schema-registry.mjs'
          import { verifySafeTree } from '../verifier-worktree/tools/strategy-v5-workflow-security.mjs'
          verifySafeTree('.v5-preflight', 'downloaded v5 preflight artifact tree')
          const load = path => JSON.parse(readFileSync(path, 'utf8'))
          const audit = load('.v5-preflight/v5-deployment-audit.json'); const receipt = load('.v5-preflight/v5-shadow-cycle-receipt.json'); const capture = load('.v5-preflight/github-deployment-settings-capture.json'); const api = load('.v5-preflight/github-settings-api-receipt.json'); const drift = load('.v5-preflight/github-settings-drift-evidence.json')
          const cycleBytes = readFileSync('.v5-preflight/v5-shadow-cycle-receipt.json'); const captureBytes = readFileSync('.v5-preflight/github-deployment-settings-capture.json'); const apiBytes = readFileSync('.v5-preflight/github-settings-api-receipt.json'); const a = load('.v5-preflight/v5-actions-attestation.json'); const k = load('.v5-preflight/v5-attestation-key-registry.json')
          validateContractSchema(a); validateContractSchema(k)
          if (audit.blocked !== false || receipt.status !== 'COMPLETE' || receipt.details?.active !== false || api.verified !== true || api.blockers?.length || !verifyGitHubSettingsDriftEvidenceV5(drift, capture, api)) process.exit(1)
          verifyActionsAttestation({ attestation: a, capture, publication: null, bytesSha256: hash(captureBytes), nowMs: Date.now(), pinnedFingerprint: process.env.V5_ATTESTATION_KEY_FINGERPRINT, apiReceiptSha256: hash(apiBytes), cycleReceiptSha256: hash(cycleBytes), trustedKeyRegistry: k, trustedKeyRegistrySha256: k.content_sha256, trustedKeyRegistryByteSha256: hash(readFileSync('.v5-preflight/v5-attestation-key-registry.json')) })
          NODE
          digest="$(sha256sum .v5-preflight/v5-shadow-cycle.json | cut -d' ' -f1)"
          target="evidence/prospective-v5/$digest"
          test ! -e "$target"
          mkdir "$target"
          for file in v5-shadow-cycle.json v5-shadow-cycle-receipt.json github-settings-api-receipt.json github-deployment-settings-capture.json github-settings-drift-evidence.json v5-deployment-audit.json v5-actions-attestation.json v5-attestation-key-registry.json; do
            test ! -e "$target/$file"
            cp --no-clobber ".v5-preflight/$file" "$target/$file"
          done
          mkdir "$target/ledger"
          cp -a --no-clobber .v5-preflight/.v5-ledger/. "$target/ledger/"
          test -z "$(git diff --cached --name-only)"
          git add "$target"
          git diff --cached --name-status -- "$target" | awk -v prefix="$target/" 'BEGIN { ok=1 } { if ($1 != "A" || index($2, prefix) != 1) ok=0 } END { if (!ok || NR == 0) exit 1 }'
          test "$(git diff --cached --name-only | sed -n 's#^##p' | grep -v "^$target/" | wc -l | tr -d ' ')" = 0
          prior="$(git rev-parse HEAD)"
          git -c user.name=strategy-v5-bot -c user.email=strategy-v5-bot@users.noreply.github.com commit -m "strategy-v5: append completed-bar shadow evidence"
          git fetch --no-tags origin "$EVIDENCE_BRANCH"
          test "$(git rev-parse "origin/$EVIDENCE_BRANCH")" = "$prior"
          git push origin "HEAD:$EVIDENCE_BRANCH"
