name: strategy-v5-prospective-preflight

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      reservation:
        description: repository-relative frozen v5 reservation path
        required: false
        type: string
      source_bundle:
        description: repository-relative frozen v5 prospective source bundle path
        required: false
        type: string

permissions: {}

env:
  V5_EVIDENCE_BRANCH: strategy-v5-evidence
  V5_ATTESTATION_KEY_REGISTRY_PATH: strategy-research/config/v5-attestation-key-registry.json
  V5_EVIDENCE_BOOTSTRAP: ${{ vars.V5_EVIDENCE_BOOTSTRAP }}

jobs:
  configuration:
    runs-on: ubuntu-24.04
    environment: prospective-v5
    outputs:
      configured: ${{ steps.readiness.outputs.configured }}
    steps:
      - name: Detect scheduled SHADOW deployment configuration
        id: readiness
        env:
          V5_PROSPECTIVE_SOURCE_BUNDLE: ${{ vars.V5_PROSPECTIVE_SOURCE_BUNDLE }}
          V5_PUBLIC_KEYS_PATH: ${{ vars.V5_PUBLIC_KEYS_PATH }}
          V5_APPROVALS_PATH: ${{ vars.V5_APPROVALS_PATH }}
          V5_TRUST_ROOT_PATH: ${{ vars.V5_TRUST_ROOT_PATH }}
          V5_TRUST_ROOT_FINGERPRINT: ${{ vars.V5_TRUST_ROOT_FINGERPRINT }}
          V5_TRUST_ROOT_GENESIS_FINGERPRINT: ${{ vars.V5_TRUST_ROOT_GENESIS_FINGERPRINT }}
          V5_ACTIONS_SECRET_EVIDENCE_PATH: ${{ vars.V5_ACTIONS_SECRET_EVIDENCE_PATH }}
          V5_REPLAY_EVIDENCE_PATH: ${{ vars.V5_REPLAY_EVIDENCE_PATH }}
          V5_REVOCATION_EVIDENCE_PATH: ${{ vars.V5_REVOCATION_EVIDENCE_PATH }}
          V5_LEASE_EVIDENCE_PATH: ${{ vars.V5_LEASE_EVIDENCE_PATH }}
        run: |
          missing=()
          for name in V5_PROSPECTIVE_SOURCE_BUNDLE V5_PUBLIC_KEYS_PATH V5_APPROVALS_PATH V5_TRUST_ROOT_PATH V5_TRUST_ROOT_FINGERPRINT V5_TRUST_ROOT_GENESIS_FINGERPRINT V5_ACTIONS_SECRET_EVIDENCE_PATH V5_REPLAY_EVIDENCE_PATH V5_REVOCATION_EVIDENCE_PATH V5_LEASE_EVIDENCE_PATH; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '### Strategy v5 scheduled preflight is dormant' >> "$GITHUB_STEP_SUMMARY"
            echo "Missing deployment variables: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo 'Manual dispatches still exercise every fail-closed custody and activation gate.' >> "$GITHUB_STEP_SUMMARY"
          fi

  preflight:
    needs: configuration
    if: github.event_name == 'workflow_dispatch' || needs.configuration.outputs.configured == 'true'
    outputs:
      no_new_completed_bar: ${{ steps.cycle-noop.outputs.no_new_completed_bar }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: prospective-v5
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Mint protected settings-auditor App token
        id: settings-auditor-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
        with:
          app-id: 4716635
          private-key: ${{ secrets.V5_GITHUB_SETTINGS_AUDITOR_APP_PRIVATE_KEY_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Capture GitHub settings and OIDC evidence
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.settings-auditor-token.outputs.token }}
          V5_REQUIRE_SETTINGS_TOKEN: 'true'
          V5_REQUIRE_SETTINGS_AUDITOR: 'true'
          V5_SETTINGS_TOKEN_KIND: 'APP'
          V5_SETTINGS_AUDITOR_APP_ID: '4716635'
          V5_SETTINGS_AUDITOR_INSTALLATION_ID: '156531963'
          V5_GITHUB_SETTINGS_AUDITOR_APP_PRIVATE_KEY_PEM: ${{ secrets.V5_GITHUB_SETTINGS_AUDITOR_APP_PRIVATE_KEY_PEM }}
          V5_GITHUB_SETTINGS_APP_ID: '4716635'
          V5_REPOSITORY_OWNER_ID: ${{ vars.V5_REPOSITORY_OWNER_ID }}
          V5_REPOSITORY_VISIBILITY: ${{ vars.V5_REPOSITORY_VISIBILITY }}
          V5_EVIDENCE_WRITER_APP_ID: '4716299'
          V5_ACTIONS_ATTESTATION_SECRET_NAME: ${{ vars.V5_ACTIONS_ATTESTATION_SECRET_NAME }}
        run: ./bin/analytics strategy-v5-prospective-workflow capture-settings
      - name: Verify repository-side custody and approval contract
        if: always()
        continue-on-error: true
        env:
          V5_PUBLIC_KEYS_PATH: ${{ vars.V5_PUBLIC_KEYS_PATH }}
          V5_APPROVALS_PATH: ${{ vars.V5_APPROVALS_PATH }}
          V5_TRUST_ROOT_PATH: ${{ vars.V5_TRUST_ROOT_PATH }}
          V5_TRUST_ROOT_FINGERPRINT: ${{ vars.V5_TRUST_ROOT_FINGERPRINT }}
          V5_TRUST_ROOT_GENESIS_FINGERPRINT: ${{ vars.V5_TRUST_ROOT_GENESIS_FINGERPRINT }}
        run: ./bin/analytics strategy-v5-prospective-workflow early-audit --out v5-deployment-audit-early.json
      - name: Emit blocked diagnostic when custody audit is unavailable
        if: always()
        run: |
          if [ ! -f v5-deployment-audit-early.json ]; then
            ./bin/analytics strategy-v5-prospective-workflow early-audit --out v5-deployment-audit-early.json || true
          fi
      - name: Hydrate the latest append-only prospective ledger
        if: always()
        env:
          V5_SOURCE_BUNDLE_INPUT: ${{ inputs.source_bundle }}
          V5_PROSPECTIVE_SOURCE_BUNDLE: ${{ vars.V5_PROSPECTIVE_SOURCE_BUNDLE }}
        run: |
          rm -rf .v5-evidence-state .v5-ledger
          mkdir -p .v5-evidence-state
          bundle="${V5_SOURCE_BUNDLE_INPUT:-}"
          if [ -z "$bundle" ]; then bundle="${V5_PROSPECTIVE_SOURCE_BUNDLE:-}"; fi
          remote_ref="$(git ls-remote origin "refs/heads/strategy-v5-evidence")" || { echo 'Unable to fetch the protected strategy-v5-evidence branch; refusing to reset custody to genesis.' >&2; exit 1; }
          if [ -n "$remote_ref" ]; then
            git fetch --no-tags --depth=1 origin strategy-v5-evidence
            git archive --format=tar origin/strategy-v5-evidence > .v5-evidence-state.tar
            ./bin/analytics strategy-v5-prospective-workflow archive --label 'strategy-v5 evidence archive' --path .v5-evidence-state.tar --repository true
            tar -x --no-same-owner --no-same-permissions -f .v5-evidence-state.tar -C .v5-evidence-state
            if [ -n "$bundle" ]; then
              ./bin/analytics strategy-v5-prospective-workflow hydrate --state-root .v5-evidence-state --ledger .v5-ledger --root . --bundle "$bundle"
            else
              ./bin/analytics strategy-v5-prospective-workflow hydrate --state-root .v5-evidence-state --ledger .v5-ledger --root .
            fi
            rm -f .v5-evidence-state.tar
          else
            if [ "${V5_EVIDENCE_BOOTSTRAP:-}" != 'true' ] || [ -z "$bundle" ]; then
              echo 'Unable to fetch the protected strategy-v5-evidence branch; refusing to reset custody to genesis without explicit bootstrap and source bundle.' >&2
              exit 1
            fi
            echo 'No protected evidence branch exists; an operator must create the protected base branch before this workflow can append evidence.' >&2
            exit 1
          fi
          if [ -n "$bundle" ] && [ ! -s .v5-ledger/HEAD.json ]; then
            ./bin/analytics strategy-v5-prospective-workflow verify-bundle --root . --bundle "$bundle"
          fi
      - name: Compare durable GitHub settings baseline
        if: always()
        continue-on-error: true
        run: |
          args=(drift --capture github-deployment-settings-capture.json --api github-settings-api-receipt.json --out github-settings-drift-evidence.json)
          if [ -s .v5-previous-settings-capture.json ]; then args+=(--previous-capture .v5-previous-settings-capture.json); fi
          if [ -s .v5-previous-settings-api-receipt.json ]; then args+=(--previous-api .v5-previous-settings-api-receipt.json); fi
          ./bin/analytics strategy-v5-prospective-workflow "${args[@]}"
      - name: Run completed 4h-bar SHADOW cycle
        if: always()
        env:
          V5_SOURCE_BUNDLE_INPUT: ${{ inputs.source_bundle }}
          V5_RESERVATION_INPUT: ${{ inputs.reservation }}
          V5_PROSPECTIVE_SOURCE_BUNDLE: ${{ vars.V5_PROSPECTIVE_SOURCE_BUNDLE }}
        run: |
          bundle="${V5_SOURCE_BUNDLE_INPUT:-}"
          if [ -z "$bundle" ]; then bundle="${V5_PROSPECTIVE_SOURCE_BUNDLE:-}"; fi
          args=(cycle --receipt v5-shadow-cycle-receipt.json)
          if [ -n "$bundle" ]; then args+=(--bundle "$bundle"); fi
          if [ -s .v5-ledger/HEAD.json ]; then args+=(--ledger .v5-ledger); fi
          if [ -n "${V5_RESERVATION_INPUT:-}" ]; then args+=(--reservation "$V5_RESERVATION_INPUT"); fi
          ./bin/analytics strategy-v5-prospective-workflow "${args[@]}" > v5-shadow-cycle.json
      - name: Require a schema-valid completed SHADOW cycle
        if: always()
        run: ./bin/analytics strategy-v5-prospective-workflow require-cycle --receipt v5-shadow-cycle-receipt.json
      - name: Detect an exact no-new completed-bar cycle
        id: cycle-noop
        if: always()
        run: |
          no_new="$(jq -r 'if .details?.mode == "NO_NEW_COMPLETED_BAR" and .details?.no_new_completed_bar == true then "true" else "false" end' v5-shadow-cycle-receipt.json)"
          echo "no_new_completed_bar=$no_new" >> "$GITHUB_OUTPUT"
      - name: Require cryptographic Actions attestation
        if: always() && steps.cycle-noop.outputs.no_new_completed_bar != 'true'
        env:
          ACTIONS_ATTESTATION_PRIVATE_KEY_B64: ${{ secrets.PROD_V5_ACTIONS_ATTESTATION_PRIVATE_KEY_B64 }}
          V5_ATTESTATION_KEY_REGISTRY_PATH: ${{ env.V5_ATTESTATION_KEY_REGISTRY_PATH }}
          V5_SETTINGS_CAPTURE_PATH: github-deployment-settings-capture.json
          V5_SETTINGS_RECEIPT_PATH: github-settings-api-receipt.json
          V5_CYCLE_RECEIPT_PATH: v5-shadow-cycle-receipt.json
          V5_ATTESTATION_OUT: v5-actions-attestation.json
          V5_ATTESTATION_KEY_FINGERPRINT: ${{ vars.V5_ATTESTATION_KEY_FINGERPRINT }}
        run: |
          if jq -e '.status == "COMPLETE"' v5-shadow-cycle-receipt.json >/dev/null; then
            if [ -z "${ACTIONS_ATTESTATION_PRIVATE_KEY_B64:-}" ] || [ ! -s "$V5_ATTESTATION_KEY_REGISTRY_PATH" ]; then
              ./bin/analytics strategy-v5-prospective-workflow blocked-attestation --out v5-actions-attestation-receipt.json || true
              echo 'ACTIONS_ATTESTATION_KEY_OR_REGISTRY_UNCONFIGURED: protected key or committed registry is unavailable'
              exit 1
            fi
            ./bin/analytics strategy-v5-prospective-workflow sign-attestation
            cp --no-clobber "$V5_ATTESTATION_KEY_REGISTRY_PATH" v5-attestation-key-registry.json
          else
            echo 'SHADOW cycle is blocked; no attestation can unlock publication.'
          fi
      - name: Record verified no-transition cycle
        if: always() && steps.cycle-noop.outputs.no_new_completed_bar == 'true'
        run: ./bin/analytics strategy-v5-prospective-workflow no-op-audit --early v5-deployment-audit-early.json --out v5-deployment-audit.json
      - name: Recompute final deployment audit from post-cycle evidence
        if: always() && steps.cycle-noop.outputs.no_new_completed_bar != 'true'
        env:
          V5_PUBLIC_KEYS_PATH: ${{ vars.V5_PUBLIC_KEYS_PATH }}
          V5_APPROVALS_PATH: ${{ vars.V5_APPROVALS_PATH }}
          V5_TRUST_ROOT_PATH: ${{ vars.V5_TRUST_ROOT_PATH }}
          V5_TRUST_ROOT_FINGERPRINT: ${{ vars.V5_TRUST_ROOT_FINGERPRINT }}
          V5_TRUST_ROOT_GENESIS_FINGERPRINT: ${{ vars.V5_TRUST_ROOT_GENESIS_FINGERPRINT }}
          V5_ATTESTATION_KEY_FINGERPRINT: ${{ vars.V5_ATTESTATION_KEY_FINGERPRINT }}
          V5_ACTIONS_SECRET_EVIDENCE_PATH: ${{ vars.V5_ACTIONS_SECRET_EVIDENCE_PATH }}
          V5_REPLAY_EVIDENCE_PATH: ${{ vars.V5_REPLAY_EVIDENCE_PATH }}
          V5_REVOCATION_EVIDENCE_PATH: ${{ vars.V5_REVOCATION_EVIDENCE_PATH }}
          V5_LEASE_EVIDENCE_PATH: ${{ vars.V5_LEASE_EVIDENCE_PATH }}
        run: ./bin/analytics strategy-v5-prospective-workflow final-audit --out v5-deployment-audit.json
      - name: Upload blocked deployment audit and SHADOW cycle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategy-v5-deployment-audit
          include-hidden-files: true
          path: |
            v5-deployment-audit.json
            v5-deployment-audit-early.json
            v5-shadow-cycle.json
            v5-shadow-cycle-receipt.json
            v5-actions-attestation.json
            v5-actions-attestation-receipt.json
            .v5-ledger
            github-deployment-settings-capture.json
            github-settings-api-receipt.json
            github-settings-drift-evidence.json
            v5-attestation-key-registry.json
          if-no-files-found: warn
      - name: Keep activation fail-closed
        if: always()
        run: |
          if [ ! -s v5-deployment-audit.json ]; then echo 'Missing deployment audit; blocked.' >&2; exit 1; fi
          if jq -e '(.blocked != false and .shadow_append_eligible != true)' v5-deployment-audit.json >/dev/null; then
            echo 'Deployment custody is not append-eligible; remain blocked.' >&2
            exit 1
          fi
          if jq -e '.blocked == true' v5-deployment-audit.json >/dev/null; then
            echo 'Activation remains blocked; appending verified SHADOW evidence is permitted.'
          fi

  append-protected-evidence:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.no_new_completed_bar != 'true'
    runs-on: ubuntu-24.04
    environment: evidence-writer-v5
    concurrency:
      group: strategy-v5-evidence-append
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Mint protected evidence-writer App token
        id: evidence-writer-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
        with:
          app-id: 4716299
          private-key: ${{ secrets.V5_EVIDENCE_WRITER_APP_PRIVATE_KEY_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: strategy-v5-evidence
          path: evidence-worktree
          token: ${{ steps.evidence-writer-token.outputs.token }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          path: verifier-worktree
          token: ${{ github.token }}
          persist-credentials: false
      - name: Install Java 21 trusted verifier runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: verifier-worktree/pom.xml
      - name: Prove the freshly minted writer-App installation
        env:
          GH_TOKEN: ${{ steps.evidence-writer-token.outputs.token }}
          GITHUB_REPOSITORY_ID: ${{ github.event.repository.id }}
          V5_EVIDENCE_WRITER_APP_ID: '4716299'
          V5_EVIDENCE_WRITER_APP_SLUG: ${{ steps.evidence-writer-token.outputs.app-slug }}
          V5_EVIDENCE_WRITER_INSTALLATION_ID: '156524819'
          V5_EVIDENCE_WRITER_APP_PRIVATE_KEY_PEM: ${{ secrets.V5_EVIDENCE_WRITER_APP_PRIVATE_KEY_PEM }}
          V5_WRITER_INSTALLATION_OUT: ${{ github.workspace }}/verifier-worktree/github-writer-installation-receipt.json
        working-directory: verifier-worktree
        run: ./bin/analytics verify-evidence-writer-installation
      - name: Download verified preflight artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c809
        with:
          name: strategy-v5-deployment-audit
          path: evidence-worktree/.v5-preflight
      - name: Append immutable SHADOW evidence through a protected PR
        env:
          GH_TOKEN: ${{ steps.evidence-writer-token.outputs.token }}
          EVIDENCE_BRANCH: strategy-v5-evidence
          TRUSTED_SOURCE_SHA: ${{ github.sha }}
          V5_ATTESTATION_KEY_FINGERPRINT: ${{ vars.V5_ATTESTATION_KEY_FINGERPRINT }}
        working-directory: evidence-worktree
        run: |
          set -euo pipefail
          test "$(git -C ../verifier-worktree rev-parse HEAD)" = "$TRUSTED_SOURCE_SHA"
          test -s .v5-preflight/v5-deployment-audit.json
          test -s .v5-preflight/v5-shadow-cycle-receipt.json
          test -s .v5-preflight/v5-shadow-cycle.json
          test -s .v5-preflight/github-settings-api-receipt.json
          test -s .v5-preflight/github-settings-drift-evidence.json
          test -s .v5-preflight/v5-actions-attestation.json
          test -s .v5-preflight/v5-attestation-key-registry.json
          test -s .v5-preflight/github-deployment-settings-capture.json
          test -s .v5-preflight/.v5-ledger/HEAD.json
          test -s ../verifier-worktree/github-writer-installation-receipt.json
          cp --no-clobber ../verifier-worktree/github-writer-installation-receipt.json .v5-preflight/github-writer-installation-receipt.json
          ../verifier-worktree/bin/analytics strategy-v5-prospective-workflow verify-preflight --root .v5-preflight --fingerprint "$V5_ATTESTATION_KEY_FINGERPRINT"
          digest="$(sha256sum .v5-preflight/v5-shadow-cycle.json | cut -d' ' -f1)"
          target="evidence/prospective-v5/$digest"
          test ! -e "$target"
          mkdir "$target"
          for file in v5-shadow-cycle.json v5-shadow-cycle-receipt.json github-settings-api-receipt.json github-deployment-settings-capture.json github-settings-drift-evidence.json v5-deployment-audit.json v5-actions-attestation.json v5-attestation-key-registry.json github-writer-installation-receipt.json; do
            test ! -e "$target/$file"
            cp --no-clobber ".v5-preflight/$file" "$target/$file"
          done
          ../verifier-worktree/bin/analytics strategy-v5-prospective-workflow hydrate-delta --target "$target" --base evidence/prospective-v5 --preflight .v5-preflight
          ../verifier-worktree/bin/analytics strategy-v5-prospective-workflow verify-snapshot --proposed "$target" --trusted-base . --registry "$V5_ATTESTATION_KEY_REGISTRY_PATH" --fingerprint "$V5_ATTESTATION_KEY_FINGERPRINT"
          test ! -e "$target/ledger/.transactions" && test ! -e "$target/ledger/.lock"
          test -z "$(git diff --cached --name-only)"
          git add "$target"
          git diff --cached --name-status -- "$target" | awk -v prefix="$target/" 'BEGIN { ok=1 } { if ($1 != "A" || index($2, prefix) != 1) ok=0 } END { if (!ok || NR == 0) exit 1 }'
          staged_outside_target="$(git diff --cached --name-only | awk -v prefix="$target/" 'index($0, prefix) != 1 { print }')"
          test -z "$staged_outside_target"
          prior="$(git rev-parse HEAD)"
          TEMP_BRANCH="strategy-v5-append-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$TEMP_BRANCH"
          git -c user.name=strategy-v5-bot -c user.email=strategy-v5-bot@users.noreply.github.com commit -m "strategy-v5: append completed-bar shadow evidence"
          git fetch --no-tags origin "$EVIDENCE_BRANCH"
          test "$(git rev-parse "origin/$EVIDENCE_BRANCH")" = "$prior"
          git push origin "HEAD:$TEMP_BRANCH"
          export GH_TOKEN="${GH_TOKEN:?protected writer App token is required}"
          pr_number="$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" -f title='strategy-v5: append completed-bar shadow evidence' -f head="$TEMP_BRANCH" -f base="$EVIDENCE_BRANCH" | jq -r '.number // empty')"
          test -n "$pr_number"
          head_sha="$(git rev-parse HEAD)"
          required_status_context='strategy-v5-evidence-custody'
          merged=false
          for attempt in $(seq 1 30); do
            pr_state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" || true)"
            test "$(printf '%s' "$pr_state" | jq -r '.head.sha // empty')" = "$head_sha" || { test "$attempt" -lt 30 || { echo 'protected PR head changed or could not be read' >&2; exit 1; }; sleep 2; continue; }
            merge_response="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr_number/merge" -f sha="$head_sha" -f merge_method=merge || true)"
            merged="$(printf '%s' "$merge_response" | jq -r 'if .merged == true then "true" else "false" end')"
            test "$merged" = true && break
            test "$attempt" -lt 30 || { echo "$required_status_context did not authorize the exact PR head; protected rules remain enforced" >&2; exit 1; }
            sleep 2
          done
          test "$merged" = true
          git fetch --no-tags origin "$EVIDENCE_BRANCH"
          git merge-base --is-ancestor "$head_sha" "origin/$EVIDENCE_BRANCH"
          git diff-tree --check "origin/$EVIDENCE_BRANCH"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$TEMP_BRANCH"
          test -z "$(git ls-remote --heads origin "$TEMP_BRANCH")"
