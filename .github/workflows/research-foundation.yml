name: research-foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit and contract suite
        run: npm test
      - name: Run pinned DuckDB integration
        run: |
          docker version
          node test/research-foundation-v3-docker-test.mjs
