name: research-foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run the complete Java unit, contract, and integration reactor
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Re-run the pinned DuckDB and immutable Parquet contract explicitly
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -pl analytics-market-data -am
          -Dtest=ResearchDataTest#originalDockerParquetContractRunsLocallyAndIsIdempotent
          -Dsurefire.failIfNoSpecifiedTests=false
          test
