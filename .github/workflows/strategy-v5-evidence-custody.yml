name: strategy-v5-evidence-custody

on:
  pull_request:
    branches:
      - strategy-v5-evidence

# This verifier is deliberately read-only.  The protected evidence ruleset
# requires its `strategy-v5-evidence-custody` check before an append can merge.
permissions: {}

jobs:
  verify:
    name: strategy-v5-evidence-custody
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the trusted base verifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
          path: verifier-worktree
          # The read-only checkout credential is needed only to fetch the PR
          # object below; this job has no write permission and never pushes.
          persist-credentials: true

      # Git objects and the proposed evidence bytes are untrusted data.  Do
      # this diff/object inspection before Java or any repository-provided
      # module is executed, and never checkout the PR head as the verifier.
      - name: Inspect PR objects and materialize proposed evidence
        working-directory: verifier-worktree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/v5/pr-head"
          test "$(git rev-parse refs/v5/pr-head)" = "$HEAD_SHA"
          git diff --name-status --find-renames "$BASE_SHA...$HEAD_SHA" > .v5-custody-diff
          proposed_root="$(awk -F '\t' '
            BEGIN { ok = 1; count = 0 }
            {
              split($2, parts, "/")
              root = "evidence/prospective-v5/" parts[3]
              valid = $1 == "A" && parts[1] == "evidence" && parts[2] == "prospective-v5" && length(parts[3]) == 64 && parts[3] !~ /[^0-9a-f]/ && parts[4] != ""
              if (!valid) { print "non-additive or out-of-scope evidence change: " $0 > "/dev/stderr"; ok = 0 }
              else if (!(root in roots)) { roots[root] = 1; count += 1 }
            }
            END { if (count != 1 || !ok) exit 1; for (root in roots) print root }
          ' .v5-custody-diff)" || { echo 'PR must add exactly one evidence/prospective-v5/<64hex>/ snapshot root' >&2; exit 1; }
          printf '%s\n' "$proposed_root" > .v5-proposed-root
          git archive --format=tar "$HEAD_SHA" "$proposed_root" > .v5-proposed.tar

      - name: Install Java 21 trusted verifier runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: verifier-worktree/pom.xml

      - name: Validate and extract proposed evidence archive
        working-directory: verifier-worktree
        run: |
          set -euo pipefail
          # Validate untrusted archive member names, types, and deterministic
          # JSON/byte ceilings before tar is allowed to create any path.
          proposed_root="$(tr -d '\r\n' < .v5-proposed-root)"
          ./bin/analytics strategy-v5-workflow-security snapshot-root .v5-custody-diff "$proposed_root"
          ./bin/analytics strategy-v5-workflow-security archive 'proposed evidence archive' .v5-proposed.tar
          rm -rf .v5-proposed
          mkdir -p .v5-proposed
          tar -xf .v5-proposed.tar -C .v5-proposed
          test -d .v5-proposed/evidence/prospective-v5

      - name: Verify additive-only immutable evidence bytes
        working-directory: verifier-worktree
        env:
          V5_ATTESTATION_KEY_FINGERPRINT: ${{ vars.V5_ATTESTATION_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          snapshot_root="$(tr -d '\r\n' < .v5-proposed-root)"
          registry="${V5_ATTESTATION_KEY_REGISTRY_PATH:-strategy-research/config/v5-attestation-key-registry.json}"
          ./bin/analytics strategy-v5-workflow-security snapshot-root .v5-custody-diff "$snapshot_root"
          ./bin/analytics strategy-v5-workflow-security snapshot \
            ".v5-proposed/$snapshot_root" . "$registry" "${V5_ATTESTATION_KEY_FINGERPRINT:-}"
